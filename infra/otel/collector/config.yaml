receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - ${env:ALLOWED_ORIGIN}
          # 브라우저 exporter 는 Content-Type: application/json 의 cross-origin fetch 라 preflight 가 필수다.
          # 이 헤더가 없으면 브라우저가 5초만 기억해 export 마다 OPTIONS 가 붙는다. Chromium 상한인 2시간으로 둔다.
          max_age: 7200

  # 값이 저장되지 못하고 사라진 수를 Mimir 에 같이 남긴다. Mimir 가 버린 표본(같은 시리즈에 같은 밀리초의
  # 값이 두 개 오면 하나를 버린다, blog-experiments 의 E10)과 collector 가 받은 수, 내보내지 못한 수다.
  prometheus/loss:
    config:
      scrape_configs:
        - job_name: mimir
          scrape_interval: 60s
          static_configs:
            - targets: ['mimir:9009']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: cortex_discarded_samples_total
              action: keep
        - job_name: collector
          scrape_interval: 60s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: otelcol_(receiver_accepted|receiver_refused|exporter_send_failed)_(metric_points|spans)(_total)?
              action: keep

processors:
  # limit_percentage 는 cgroup 메모리 상한 기준이라 compose 의 collector 메모리 상한이 있어야 뜻이 있다.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # 수집 주소는 누구나 보낼 수 있으므로 브라우저 쪽 수집 코드가 쓰는 스키마를 서버에서도 강제한다. 다른 service.name,
  # 모르는 metric 이름, histogram 이 아니거나 delta 가 아닌 metric, 허용 목록 밖의 라벨 값은 버린다. 가짜 값 자체는
  # 막지 못하지만, 라벨 조합 수가 설계값(수천 개)을 넘지 못하게 해서 시리즈 폭증과 메모리 소진을 막는다.
  filter/schema:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] != "yceffort-blog"'
        - 'not IsMatch(name, "^cwv\\.")'
    metrics:
      metric:
        - 'resource.attributes["service.name"] != "yceffort-blog"'
        - 'not IsMatch(name, "^cwv\\.(ttfb|fcp|lcp|inp|cls)$")'
        - 'type != METRIC_DATA_TYPE_HISTOGRAM'
        - 'aggregation_temporality != AGGREGATION_TEMPORALITY_DELTA'
      datapoint:
        - 'not IsString(attributes["page.route"]) or not IsMatch(attributes["page.route"], "^(home|post|tag|series|other)$")'
        - 'not IsString(attributes["page.lang"]) or not IsMatch(attributes["page.lang"], "^(ko|en)$")'
        - 'not IsString(attributes["device.class"]) or not IsMatch(attributes["device.class"], "^(mobile|tablet|desktop)$")'
        - 'not IsString(attributes["browser.engine"]) or not IsMatch(attributes["browser.engine"], "^(chromium|webkit|gecko|other)$")'
        - 'not IsString(attributes["navigation.type"]) or not IsMatch(attributes["navigation.type"], "^(navigate|reload|back-forward|back-forward-cache|prerender|restore|soft-navigation)$")'
        - 'not IsString(attributes["rating"]) or not IsMatch(attributes["rating"], "^(good|needs-improvement|poor)$")'
        - 'attributes["interaction.type"] != nil and (not IsString(attributes["interaction.type"]) or not IsMatch(attributes["interaction.type"], "^(pointer|keyboard)$"))'

  # 검사를 통과한 뒤에도 모르는 라벨 키는 지우고, span 속성은 개수와 길이를 제한한다.
  transform/schema:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "telemetry.sdk.language", "telemetry.sdk.name", "telemetry.sdk.version"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["page.route", "page.lang", "device.class", "browser.engine", "navigation.type", "rating", "interaction.type"])
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "telemetry.sdk.language", "telemetry.sdk.name", "telemetry.sdk.version"])
      - context: span
        statements:
          - limit(attributes, 64, [])
          - truncate_all(attributes, 512)

  # 글에서 재현한 공용 관측 인프라와 같은 조건을 그대로 둔다. 판정 시점에 span 이 2개 미만인 trace 는 버린다.
  tail_sampling:
    decision_wait: 15s
    policies:
      - name: at-least-two-spans
        type: span_count
        span_count:
          min_spans: 2

  # 브라우저가 보낸 delta 를 누적으로 바꾸지 않고 Mimir 에 그대로 저장한다(native delta ingestion).
  # 누적으로 바꾸면(delta_to_cumulative) 방문이 드문 라벨 조합은 샘플이 하나뿐이라 increase() 가 0 을 돌려주고,
  # 5분 넘게 조용한 시리즈는 지워져 다시 1부터 쌓인다(blog-experiments 의 E4, E8).
  # 시각은 collector 가 받은 시각으로 바꾼다. 브라우저마다 시계가 달라 같은 시리즈에 순서가 뒤바뀐 샘플이 쌓이지 않게 한다.
  transform/receive_time:
    metric_statements:
      - context: datapoint
        statements:
          - set(start_time, Now())
          - set(time, Now())

  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp_http/mimir:
    endpoint: http://mimir:9009/otlp
    headers:
      X-Scope-OrgID: blog

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [memory_limiter, filter/schema, transform/schema, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          filter/schema,
          transform/schema,
          transform/receive_time,
          batch,
        ]
      exporters: [otlp_http/mimir]
    metrics/loss:
      receivers: [prometheus/loss]
      processors: [batch]
      exporters: [otlp_http/mimir]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
