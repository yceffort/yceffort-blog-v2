receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - ${env:ALLOWED_ORIGIN}

  # 값이 저장되지 못하고 사라진 수를 Mimir 에 같이 남긴다. Mimir 가 버린 표본(같은 시리즈에 같은 밀리초의
  # 값이 두 개 오면 하나를 버린다, blog-experiments 의 E10)과 collector 가 받은 수, 내보내지 못한 수다.
  prometheus/loss:
    config:
      scrape_configs:
        - job_name: mimir
          scrape_interval: 60s
          static_configs:
            - targets: ['mimir:9009']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: cortex_discarded_samples_total
              action: keep
        - job_name: collector
          scrape_interval: 60s
          static_configs:
            - targets: ['localhost:8888']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: otelcol_(receiver_accepted|receiver_refused|exporter_send_failed)_(metric_points|spans)(_total)?
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # 글에서 재현한 공용 관측 인프라와 같은 조건을 그대로 둔다. 판정 시점에 span 이 2개 미만인 trace 는 버린다.
  tail_sampling:
    decision_wait: 15s
    policies:
      - name: at-least-two-spans
        type: span_count
        span_count:
          min_spans: 2

  # 브라우저가 보낸 delta 를 누적으로 바꾸지 않고 Mimir 에 그대로 저장한다(native delta ingestion).
  # 누적으로 바꾸면(delta_to_cumulative) 방문이 드문 라벨 조합은 샘플이 하나뿐이라 increase() 가 0 을 돌려주고,
  # 5분 넘게 조용한 시리즈는 지워져 다시 1부터 쌓인다(blog-experiments 의 E4, E8).
  # 시각은 collector 가 받은 시각으로 바꾼다. 브라우저마다 시계가 달라 같은 시리즈에 순서가 뒤바뀐 샘플이 쌓이지 않게 한다.
  transform/receive_time:
    metric_statements:
      - context: datapoint
        statements:
          - set(start_time, Now())
          - set(time, Now())

  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlp_http/mimir:
    endpoint: http://mimir:9009/otlp
    headers:
      X-Scope-OrgID: blog

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/receive_time, batch]
      exporters: [otlp_http/mimir]
    metrics/loss:
      receivers: [prometheus/loss]
      processors: [batch]
      exporters: [otlp_http/mimir]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
