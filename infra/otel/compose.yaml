# 블로그의 Core Web Vitals 를 받는 수집 서버. 버전은 blog-experiments 의 cwv-otel-grafana lab 과 같고, metric 경로는 다르다
# (README 의 'metric 경로가 lab 과 다른 이유').
# 사용: cp env.example .env 로 값을 채운 뒤 docker compose up -d
name: blog-otel
services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      - OTEL_DOMAIN=${OTEL_DOMAIN:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - '80:80' # 인증서 발급(HTTP-01)
      - '443:443'
    depends_on:
      - collector

  collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:?}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - mimir

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command:
      ['-target=all', '-config.file=/etc/tempo.yaml', '-config.expand-env=true']
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-8760h}
      - TEMPO_QUERY_RANGE=${TEMPO_QUERY_RANGE:-8760h}
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  mimir:
    image: grafana/mimir:3.2.2
    restart: unless-stopped
    # collector 가 OTLP 로 보내는 delta 를 그대로 저장하고, 이름에 단위 접미사(_milliseconds)를 붙인다.
    command:
      [
        '-config.file=/etc/mimir.yaml',
        '-compactor.blocks-retention-period=${MIMIR_RETENTION:-0}',
        '-distributor.otel-native-delta-ingestion=true',
        '-distributor.otel-metric-suffixes-enabled=true',
      ]
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      # 기본 설치로는 쓰지 않는 앱 플러그인을 받고 내장 데이터소스 플러그인마다 프로세스를 띄워 2GB 서버에서
      # 600MiB 넘게 쓴다. Mimir(prometheus)와 Tempo 만 남기면 200MiB 안쪽이다.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_DISABLE_PLUGINS=elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,zipkin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:3000:3000' # SSH 터널로만 연다
    depends_on:
      - tempo
      - mimir

volumes:
  caddy-data:
  tempo-data:
  mimir-data:
