pre-commit:
  jobs:
    # 포매터가 같은 파일을 동시에 쓰지 않도록 병렬 그룹보다 먼저 실행한다
    - name: post-updated
      glob: 'apps/blog/posts/**/*.{md,mdx}'
      run: node apps/blog/scripts/stamp-post-updated.mjs {staged_files}
      stage_fixed: true
    - group:
        parallel: true
        jobs:
          - name: oxlint
            glob: '*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}'
            exclude:
              - 'labs/**'
              - 'experiments/**'
            run: pnpm exec oxlint --type-aware --fix {staged_files}
            stage_fixed: true
          - name: oxfmt
            glob: '*.{ts,cts,mts,tsx,js,cjs,mjs,jsx,json,md,yaml,yml,toml}'
            # 생성한 대시보드 JSON 은 .oxfmtrc.json 에서도 뺐다. 그것만 staged 면 oxfmt 가 대상 없음으로 실패한다.
            exclude:
              - 'labs/**'
              - 'infra/otel/grafana/dashboards/**'
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: stylelint
            root: 'apps/blog/'
            glob: '*.{scss,css}'
            run: pnpm exec stylelint --fix {staged_files}
            stage_fixed: true
          - name: rust-markdownlint
            glob: '*.md'
            exclude: 'labs/**'
            run: pnpm exec rust-markdownlint --fix --no-globs {staged_files}
            stage_fixed: true
          - name: markdown
            glob: '*.{md,mdx}'
            exclude: 'labs/**'
            run: node apps/blog/scripts/check-markdown.mjs {staged_files}
          - name: research-markdown
            glob: 'apps/research/research/*.md'
            run: node apps/research/scripts/check-slides-markdown.mjs {staged_files}
          - name: research-tags
            glob: 'apps/research/research/*.md'
            run: node apps/research/scripts/retag-slides.mjs --apply {staged_files} || echo '덱 태그 판정 실패. 기존 태그로 커밋합니다.'
            stage_fixed: true
          - name: translation-sync
            glob: '*.md'
            exclude: 'labs/**'
            run: node apps/blog/scripts/check-translation-sync.mjs {staged_files}
          - name: related-posts
            glob: 'apps/blog/posts/**/*.{md,mdx}'
            run: node apps/blog/scripts/generate-related-posts.mjs && git add apps/blog/data/related-posts.json apps/blog/data/related-scores.json || echo '관련 글 갱신 실패. 태그 방식으로 폴백됩니다.'
